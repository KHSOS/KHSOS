name: Update profile artwork
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0
      - run: python scripts/render_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contrib-heatmap.svg khsos-ascii.svg stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile artwork'
            git push
          fi
